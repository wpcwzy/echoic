# ============================================================================
# Echoic CI：后端测试 + 前端构建 + PR 镜像构建（不推送）
# 触发：push / PR 到 main、手动派发；仅文档变更不触发。
# 备注：frontend/package-lock.json 的 resolved 指向 registry.npmmirror.com，
#       因此 CI 中统一通过 npm_config_replace_registry_host=always 改写为官方源。
# ============================================================================
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

# 同一分支/PR 的重复运行自动取消，节省 Actions 配额
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 后端：pytest（含 API / 管线 / Provider / 演示数据；ffmpeg 相关用例依赖系统 ffmpeg）
  # ---------------------------------------------------------------------------
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Set up ffmpeg
        # 使用预编译静态版 ffmpeg（工具缓存命中后秒级完成），避免 apt 源慢/挂起问题：
        # 首次 CI 曾因 apt 下载卡住 >20min，随后 180s 超时；runner 镜像未必预装 ffmpeg。
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release
          architecture: x64

      - name: Verify ffmpeg
        run: |
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run pytest
        working-directory: backend
        env:
          ECHOIC_DEMO_SEED: "false"
        run: pytest -q

  # ---------------------------------------------------------------------------
  # pgvector 暂存验证（v1.0 staging）：真实 PostgreSQL 16 + pgvector 扩展
  #
  # 目的：SQLite/默认测试里 pgvector 只能 mock/skip，这里用 pgvector/pgvector:pg16
  #       真实服务验证「扩展可用 + chunk_vectors DDL/HNSW + upsert/search/ACL/
  #       delete/stats + 模型 stale + 维度变更重建」整条链路，PG 回归会真实失败。
  # 说明：
  #   - 测试文件由 backend-search 提供（backend/tests/test_vector_pgvector_staging.py），
  #     未就绪时本 job 自动跳过（保留绿色），就绪后自动开始执行；
  #   - 测试读取 ECHOIC_PGVECTOR_TEST_DSN，未设置时模块级 skip；本 job 显式设置为服务 DSN；
  #   - POSTGRES_USER 必须是超级用户（测试需要 CREATE EXTENSION vector）；
  #     pgvector 官方镜像 initdb 会把 POSTGRES_USER 建成超级用户，故用 echoic 即可；
  #   - 不设置 ECHOIC_VECTOR_BACKEND：测试自建 SQLAlchemy 引擎，不依赖应用全局向量选择；
  #   - 不需要 ffmpeg（后端 job 已覆盖 ffmpeg 相关测试）。
  # ---------------------------------------------------------------------------
  pgvector-staging:
    name: pgvector staging (real PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: echoic
          POSTGRES_PASSWORD: echoic
          POSTGRES_DB: echoic
        ports:
          - 5432:5432
        # 等待数据库就绪，避免测试过早连接；pg_isready 在容器内可用
        options: >-
          --health-cmd "pg_isready -U echoic -d echoic"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check pgvector staging test exists
        id: staging
        # 测试文件可能由并行开发任务提供；不存在时给 notice 并跳过后续步骤，不伪造结果
        run: |
          if [ -f backend/tests/test_vector_pgvector_staging.py ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "pgvector staging test found: backend/tests/test_vector_pgvector_staging.py"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::backend/tests/test_vector_pgvector_staging.py 不存在，跳过 pgvector 暂存验证（v1.0 发布前必须存在并通过）"
          fi

      - name: Set up Python 3.12
        if: steps.staging.outputs.exists == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install Python dependencies
        if: steps.staging.outputs.exists == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Verify pgvector extension is available in the service image
        if: steps.staging.outputs.exists == 'true'
        env:
          PGPASSWORD: echoic
        run: |
          # 明确区分「镜像/服务问题」与「测试回归」：确认服务可连且镜像自带 vector 扩展。
          # 注意：pg_available_extensions 的列是 name/default_version/installed_version/comment，
          # 没有 extversion 列（extversion 只在 CREATE EXTENSION 之后的 pg_extension 里）；
          # 扩展由测试自己创建，因此这里只校验「镜像具备可安装的 vector 扩展」。
          python - <<'PY'
          import sys
          import time

          import psycopg

          dsn = "host=127.0.0.1 port=5432 user=echoic password=echoic dbname=echoic"
          last_error = None
          for attempt in range(1, 31):
              try:
                  with psycopg.connect(dsn, connect_timeout=3) as connection:
                      row = connection.execute(
                          "SELECT default_version, installed_version "
                          "FROM pg_available_extensions WHERE name = 'vector'"
                      ).fetchone()
                      server_version = connection.execute("SHOW server_version").fetchone()[0]
                  if row and row[0]:
                      installed = row[1] or "not-created-yet (test creates it)"
                      print(
                          f"PostgreSQL {server_version} ready; "
                          f"pgvector available: {row[0]} (installed={installed})"
                      )
                      sys.exit(0)
                  sys.exit("PostgreSQL 已启动但镜像内缺少 pgvector 扩展（请检查服务镜像）")
              except Exception as exc:  # noqa: BLE001 - retry until service is up
                  last_error = f"{type(exc).__name__}: {exc}"
                  print(f"waiting for pgvector service ({attempt}/30): {last_error}")
                  time.sleep(2)
          sys.exit(f"PostgreSQL/pgvector 服务未就绪：{last_error}")
          PY

      - name: Run pgvector staging test
        if: steps.staging.outputs.exists == 'true'
        working-directory: backend
        env:
          # 与服务 environment 一致；测试会 CREATE EXTENSION vector（需超级用户）
          ECHOIC_PGVECTOR_TEST_DSN: postgresql+psycopg://echoic:echoic@127.0.0.1:5432/echoic
          ECHOIC_DEMO_SEED: "false"
        run: python -m pytest -q tests/test_vector_pgvector_staging.py

  # ---------------------------------------------------------------------------
  # 前端：npm ci（官方源）→ tsc 类型检查 → vite 生产构建
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend build (tsc + vite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # lockfile resolved 指向 npmmirror；replace-registry-host=always 在下载时改写为官方源
      npm_config_registry: https://registry.npmjs.org
      npm_config_replace_registry_host: always
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund --registry=https://registry.npmjs.org --replace-registry-host=always

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npm run build

  # ---------------------------------------------------------------------------
  # PR 镜像构建（仅 amd64，不推送）：验证 Dockerfile 可构建
  # fork PR 不运行（无法写入仓库级 Actions cache，且避免浪费上游配额）
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker image build (amd64, no push)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NPM_REGISTRY=https://registry.npmjs.org
            PIP_INDEX_URL=https://pypi.org/simple
