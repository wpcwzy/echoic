# ============================================================================
# Echoic CI：后端测试 + 前端构建 + PR 镜像构建（不推送）
# 触发：push / PR 到 main、手动派发；仅文档变更不触发。
# 备注：frontend/package-lock.json 的 resolved 指向 registry.npmmirror.com，
#       因此 CI 中统一通过 npm_config_replace_registry_host=always 改写为官方源。
# ============================================================================
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

# 同一分支/PR 的重复运行自动取消，节省 Actions 配额
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 后端：pytest（含 API / 管线 / Provider / 演示数据；ffmpeg 相关用例依赖系统 ffmpeg）
  # ---------------------------------------------------------------------------
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run pytest
        working-directory: backend
        env:
          ECHOIC_DEMO_SEED: "false"
        run: pytest -q

  # ---------------------------------------------------------------------------
  # 前端：npm ci（官方源）→ tsc 类型检查 → vite 生产构建
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend build (tsc + vite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # lockfile resolved 指向 npmmirror；replace-registry-host=always 在下载时改写为官方源
      npm_config_registry: https://registry.npmjs.org
      npm_config_replace_registry_host: always
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund --registry=https://registry.npmjs.org --replace-registry-host=always

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npm run build

  # ---------------------------------------------------------------------------
  # PR 镜像构建（仅 amd64，不推送）：验证 Dockerfile 可构建
  # fork PR 不运行（无法写入仓库级 Actions cache，且避免浪费上游配额）
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker image build (amd64, no push)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NPM_REGISTRY=https://registry.npmjs.org
            PIP_INDEX_URL=https://pypi.org/simple
