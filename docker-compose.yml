# ============================================================================
# Echoic 一键部署编排（镜像优先 / image-first，v0.2+）
#
# 默认方式：直接拉取预构建多架构镜像（无需本地构建，最快）：
#   cp .env.example .env                      # 修改 ECHOIC_ADMIN_PASSWORD / ECHOIC_SECRET_KEY
#   docker compose pull                       # 拉取 ghcr.io/wpcwzy/echoic:${ECHOIC_IMAGE_TAG}
#   docker compose up -d                      # 启动
#   浏览器打开 http://localhost:8000
#
# 镜像标签（.env 中 ECHOIC_IMAGE_TAG）：
#   latest  ：main 分支最新构建（默认，适合体验）
#   v0.2.0  ：语义化版本（生产建议固定版本）
#   sha-xxx ：某次提交构建（可复现）
#
# 从源码构建（开发/定制）：
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#   镜像会以 echoic:local 本地标签构建（不覆盖官方 latest）。
#
# 可选组件（按需启用，默认不启动）：
#   docker compose --profile minio    up -d              # 自托管 MinIO（S3 兼容对象存储，v0.3.0）
#   docker compose --profile postgres up -d              # 外置 PostgreSQL 16
#   docker compose --profile worker   up -d              # 独立 worker（主服务不再跑内嵌线程）
#   docker compose --profile qdrant   up -d              # 外置 Qdrant 向量库（v1.0 可选加速层）
#   docker compose --profile postgres --profile worker up -d   # 两者同时
#   docker compose --profile minio --profile worker   up -d    # MinIO + 独立 worker
#   docker compose --profile postgres --profile qdrant up -d   # PostgreSQL + Qdrant
# 使用外部 PostgreSQL 时，需在 .env 中设置：
#   ECHOIC_DATABASE_URL=postgresql+psycopg://echoic:<口令>@postgres:5432/echoic
# 使用独立 worker 时，需在 .env 中设置 ECHOIC_EMBEDDED_WORKER=false。
# 使用 MinIO（v0.3.0 对象存储）时，需在 .env 中设置：
#   ECHOIC_STORAGE_BACKEND=s3、ECHOIC_S3_ENDPOINT=http://minio:9000、ECHOIC_S3_PATH_STYLE=true，
#   以及与本文件 ECHOIC_MINIO_ROOT_USER/PASSWORD 一致的 ECHOIC_S3_ACCESS_KEY/SECRET_KEY。
# 使用 Qdrant（v1.0 可选向量后端）时，需在 .env 中设置 ECHOIC_QDRANT_URL=http://qdrant:6333
#   （本机进程访问改为 http://localhost:6333）；未配置/不可用时自动降级 numpy，不影响服务启动。
# ============================================================================

name: echoic

services:
  # ---------------------------- 主服务（API + 前端 + 内嵌 worker）----------------------------
  echoic:
    # 镜像优先：默认不构建。源码构建请叠加 docker-compose.build.yml。
    image: ghcr.io/wpcwzy/echoic:${ECHOIC_IMAGE_TAG:-latest}
    ports:
      - "${ECHOIC_HTTP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      # 容器内路径固定，避免 .env 中面向本机开发的值影响容器
      ECHOIC_DATA_DIR: /data
      ECHOIC_STATIC_DIR: /app/backend/app/static
      # 使用 --profile postgres 或外部数据库时在 .env 设为 true：入口脚本会等待数据库端口就绪
      ECHOIC_WAIT_FOR_DB: ${ECHOIC_WAIT_FOR_DB:-false}
    volumes:
      - echoic-data:/data
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/system/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # ---------------------------- 可选：Qdrant 向量库（--profile qdrant，v1.0）----------------------------
  # 用途：外置 ANN 向量库，作为 v1.0 可选向量后端（默认 numpy/sqlite-vec/pgvector 已覆盖多数场景）。
  #       仅在「多实例共享索引 / 百万级 chunk / 需要独立扩缩容」时启用；**不是硬依赖**：
  #       Qdrant 未启动或不可达时，auto 模式自动降级 numpy 并在 /api/vector/status 给 fallback_reason。
  #
  # 启动步骤：
  #   1) docker compose --profile qdrant up -d           # 拉起 qdrant + echoic
  #   2) .env 设置（compose 内用服务名 qdrant；宿主机/本机进程用 http://localhost:6333）：
  #        ECHOIC_QDRANT_URL=http://qdrant:6333
  #        ECHOIC_QDRANT_API_KEY=<生产必填的强随机 Key；留空=不鉴权，仅本地体验>
  #        ECHOIC_QDRANT_COLLECTION=echoic_chunks
  #        ECHOIC_QDRANT_TIMEOUT=10
  #        # ECHOIC_VECTOR_BACKEND=qdrant                 # 可选：强制使用（默认 auto 自动选优）
  #   3) docker compose up -d                            # 重建 echoic 使配置生效
  #
  # 版本：固定 qdrant/qdrant:v1.20.0（已校验 Docker Hub 存在 linux/amd64 + linux/arm64 多架构）；
  #      升级请改 tag 后观察容器 /readyz 与 /api/vector/status。
  # 安全：默认仅把 6333/6334 绑定到 127.0.0.1（不直接公网暴露）；生产请设置 ECHOIC_QDRANT_API_KEY
  #      （同一变量同时注入 QDRANT__SERVICE__API_KEY 与服务端连接配置）。
  # 备份：向量数据在 echoic-qdrant 卷；原始 chunk/embedding 仍在 echoic-data 数据库内，可随时重建索引。
  qdrant:
    profiles: ["qdrant"]
    image: ${ECHOIC_QDRANT_IMAGE:-qdrant/qdrant:v1.20.0}
    restart: unless-stopped
    environment:
      # 空值 = 不启用 API Key 鉴权（仅本地体验）；生产务必设置强随机 Key（与 ECHOIC_QDRANT_API_KEY 一致）
      QDRANT__SERVICE__API_KEY: ${ECHOIC_QDRANT_API_KEY:-}
      # 显式声明 gRPC 端口（默认即 6334；本仓库客户端走 REST 6333，保留端口便于调试）
      QDRANT__SERVICE__GRPC_PORT: 6334
    ports:
      - "127.0.0.1:${ECHOIC_QDRANT_HTTP_PORT:-6333}:6333"   # REST/HTTP API（含 /readyz、Web UI）
      - "127.0.0.1:${ECHOIC_QDRANT_GRPC_PORT:-6334}:6334"   # gRPC API（可选）
    volumes:
      - echoic-qdrant:/qdrant/storage
    healthcheck:
      # 官方镜像不含 curl/wget，用 bash 的 /dev/tcp 探测 HTTP 端口（不依赖 API Key）
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------------------------- 可选：独立 worker 进程（--profile worker）----------------------------
  # 复用同一镜像；与 echoic 共享数据卷与数据库。适合 CPU 密集处理时把任务线程与 API 隔离。
  echoic-worker:
    profiles: ["worker"]
    image: ghcr.io/wpcwzy/echoic:${ECHOIC_IMAGE_TAG:-latest}
    command: ["python", "-m", "app.worker"]
    env_file:
      - .env
    environment:
      ECHOIC_DATA_DIR: /data
      ECHOIC_STATIC_DIR: /app/backend/app/static
      ECHOIC_EMBEDDED_WORKER: "false"
      # 与 postgres profile 组合使用时务必设为 true，确保 worker 等到数据库就绪
      ECHOIC_WAIT_FOR_DB: ${ECHOIC_WAIT_FOR_DB:-false}
    volumes:
      - echoic-data:/data
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    depends_on:
      echoic:
        condition: service_healthy
    # 说明：compose 不支持按 profile 动态 depends_on。与 --profile postgres 组合使用时，
    # 请同时设置 ECHOIC_WAIT_FOR_DB=true（入口脚本会等待数据库可用，随后主服务与 worker 自动就绪）。

  # ---------------------------- 可选：PostgreSQL 16（--profile postgres）----------------------------
  postgres:
    profiles: ["postgres"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-echoic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-echoic}
      POSTGRES_DB: ${POSTGRES_DB:-echoic}
    volumes:
      - echoic-pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-echoic} -d ${POSTGRES_DB:-echoic}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # 默认不暴露端口；仅本机调试时可取消注释
    # ports:
    #   - "127.0.0.1:5432:5432"

  # ---------------------------- 可选：MinIO 对象存储（--profile minio，v0.3.0）----------------------------
  # 用途：为对象存储抽象（R-21）提供自托管 S3 兼容存储；媒体可外置到 MinIO，数据卷只保留 DB/密钥。
  #
  # 启动步骤：
  #   1) docker compose --profile minio up -d        # 拉起 minio + minio-init + echoic
  #   2) .env 设置：
  #        ECHOIC_STORAGE_BACKEND=s3
  #        ECHOIC_S3_ENDPOINT=http://minio:9000      # 容器内互通；本机进程/宿主机用 http://localhost:9000
  #        ECHOIC_S3_ACCESS_KEY / ECHOIC_S3_SECRET_KEY 必须与 ECHOIC_MINIO_ROOT_USER / PASSWORD 一致
  #        ECHOIC_S3_PATH_STYLE=true                 # MinIO 必须 true
  #   3) docker compose up -d                          # 重启 echoic 使配置生效
  #
  # 控制台：http://localhost:${ECHOIC_MINIO_CONSOLE_PORT:-9001}（S3 API 端口见 ECHOIC_MINIO_PORT）
  # 镜像说明：MinIO 官方社区版镜像已停止公开分发（Docker Hub minio/minio 已 404、quay.io 需认证）。
  #          默认使用活跃维护的 S3 兼容分支 pgsty/silo（MinIO 协议/数据兼容，镜像内置 mcli 客户端）；
  #          如你有官方镜像访问权限，可用 ECHOIC_MINIO_IMAGE 覆盖（minio-init 复用同一镜像）。
  # 生产提示：务必修改默认账号密码；公网暴露 Console/S3 端口时请配置 HTTPS/反代与防火墙。
  minio:
    profiles: ["minio"]
    image: ${ECHOIC_MINIO_IMAGE:-docker.io/pgsty/silo:RELEASE.2026-10-26T00-00-00Z}
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${ECHOIC_MINIO_ROOT_USER:-echoic}
      MINIO_ROOT_PASSWORD: ${ECHOIC_MINIO_ROOT_PASSWORD:-change-me-echoic-minio}
      # 供容器内健康检查使用（mcli 通过 MC_HOST_local 访问本机 S3 API）
      MC_HOST_local: http://${ECHOIC_MINIO_ROOT_USER:-echoic}:${ECHOIC_MINIO_ROOT_PASSWORD:-change-me-echoic-minio}@127.0.0.1:9000
    ports:
      - "${ECHOIC_MINIO_PORT:-9000}:9000"           # S3 API
      - "${ECHOIC_MINIO_CONSOLE_PORT:-9001}:9001"   # Web Console
    volumes:
      - echoic-minio:/data
    restart: unless-stopped
    healthcheck:
      # 镜像内置 mcli（MinIO 客户端），`mcli ready local` 可可靠探测服务就绪
      test: ["CMD", "mcli", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # 一次性初始化：创建 bucket（幂等）。minio 就绪后执行；失败自动重试，成功后容器退出 0。
  minio-init:
    profiles: ["minio"]
    image: ${ECHOIC_MINIO_IMAGE:-docker.io/pgsty/silo:RELEASE.2026-10-26T00-00-00Z}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["mcli"]
    command: ["mb", "--ignore-existing", "local/${ECHOIC_S3_BUCKET:-echoic}"]
    environment:
      MC_HOST_local: http://${ECHOIC_MINIO_ROOT_USER:-echoic}:${ECHOIC_MINIO_ROOT_PASSWORD:-change-me-echoic-minio}@minio:9000
    restart: on-failure

volumes:
  # 备份这一个卷即可覆盖 SQLite 数据库、媒体文件、secret.key（详见 docs/DEPLOYMENT.md）
  echoic-data:
    name: echoic-data
  echoic-pgdata:
    name: echoic-pgdata
  # v0.3.0：启用 --profile minio 时的对象存储数据卷（S3 模式下媒体数据在此卷）
  echoic-minio:
    name: echoic-minio
  # v1.0：启用 --profile qdrant 时的向量库数据卷（可随时由 DB 中的 chunk/embedding 重建）
  echoic-qdrant:
    name: echoic-qdrant
