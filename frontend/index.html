<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply the saved/system theme before first paint to avoid a light flash.
      (function () {
        try {
          var mode = localStorage.getItem('echoic:theme-mode') || 'system'
          var mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)')
          var isPublic = location.pathname.indexOf('/s/') === 0
          var resolved = isPublic
            ? (mq && mq.matches ? 'dark' : 'light')
            : (mode === 'dark' ? 'dark' : mode === 'light' ? 'light' : (mq && mq.matches ? 'dark' : 'light'))
          document.documentElement.setAttribute('data-theme', resolved)
          document.documentElement.style.colorScheme = resolved
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
    <style>
      html {
        background: #f5f6f7;
      }
      html[data-theme='dark'] {
        background: #0f1115;
      }
    </style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1677ff" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f6f7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1115" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Echoic" />
    <title>Echoic · 私人会议录音知识库</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
